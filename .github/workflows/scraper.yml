name: Pipeline Completo Atacadão

on:
  workflow_dispatch: # Permite rodar manualmente
  schedule:
    - cron: '0 6 * * *' # Opcional: roda todo dia às 06:00 UTC

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Executar Scraper (Ingestão para o Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python ingest/scraperv2.py

      - name: 2. Executar Processamento Silver (Leitura do Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python processing/silver.py

      - name: 3. Atualizar Dimensão de Produtos
        run: python processing/dim_products.py

      - name: Salvar dados e dimensões atualizadas no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Atualização automática do pipeline (Scraper, Silver e Dim)"
          file_pattern: 'data/**'