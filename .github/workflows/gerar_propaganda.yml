name: Gerar Propaganda

on:
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  sincronizar-shopee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
        
      - name: 3. Executar Pipeline Silver (s_dim_prod)
        run: |
          # Cria o arquivo de credenciais para este passo
          echo "$GOOGLE_APPLICATION_CREDENTIALS_DATA" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="gcp_key.json"
          
          # Executa o novo script para gerar a dimensão de produtos distintos
          python -u processing/s_dim_prod.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS_DATA: ${{ secrets.GCP_SA_KEY }}