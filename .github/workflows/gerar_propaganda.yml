name: Sincronizar Produtos Supabase

on:
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  sincronizar-produtos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          


      - name: 4. Sincronizar com o Supabase
        run: |
          # Cria o arquivo de credenciais para este passo
          echo "$GOOGLE_APPLICATION_CREDENTIALS_DATA" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="gcp_key.json"
          
          # Executa o script de envio para o Supabase
          python -u processing/dim_prod.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS_DATA: ${{ secrets.GCP_SA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}