name: Sincronizar Produtos Supabase

on:
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  sincronizar-produtos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          

      - name: 5. Processar Fato Preços (Gold)
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_DATA" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="gcp_key.json"
          python -u processing/fat_precos.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS_DATA: ${{ secrets.GCP_SA_KEY }}

      - name: 6. Processar Histórico Consolidado (Gold)
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_DATA" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="gcp_key.json"
          python -u processing/gold_historico.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS_DATA: ${{ secrets.GCP_SA_KEY }}

      - name: 7. Processar Maiores Ofertas do Dia (Supabase)
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_DATA" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="gcp_key.json"
          python -u processing/ofertas_dia.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS_DATA: ${{ secrets.GCP_SA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}