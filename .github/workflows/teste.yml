name: Extração Bronze - Extraindo dados do Atacadão

on:
  workflow_dispatch: # Permite rodar manualmente
  schedule:
    - cron: '0 4 * * *' # Roda todo dia às 04:00 UTC

jobs:
  sincronizar-shopee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-cloud-bigquery db-dtypes

      - name: 2. Executar Pipeline Silver (BigQuery)
        run: |
          # Cria o arquivo de credenciais para este passo
          echo "$GOOGLE_APPLICATION_CREDENTIALS_DATA" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="gcp_key.json"
          
          # Executa o script Silver baseado no erro anterior
          python -u processing/supabase_cloud.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS_DATA: ${{ secrets.GCP_SA_KEY }}