name: Execução Única - Sincronização Shopee

on:
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  sincronizar-shopee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests supabase pyarrow

      - name: Executar Sincronização Shopee
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Certifique-se de que o token esteja nos Secrets do repositório
          SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
        run: python integration/shopee_update.py