name: Extração Bronze e Camada Silver - Atacadão

on:
  workflow_dispatch: # Permite rodar manualmente
  schedule:
    - cron: '0 4 * * *' # Roda todo dia às 04:00 UTC

jobs:
  sincronizar-shopee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 1. Executar Scraper e Enviar para o GCS / Bronze
        run: |
          # Cria um arquivo temporário com a chave JSON do GCP para a API do Google autenticar
          echo "$GOOGLE_APPLICATION_CREDENTIALS_DATA" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="gcp_key.json"
          
          # Executa o script Python atualizado da Bronze
          python -u ingest/scraperv2.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS_DATA: ${{ secrets.GCP_SA_KEY }}

      - name: 2. Executar Pipeline Silver (BigQuery - s_inge_prod_shop)
        run: |
          # Reaproveita a mesma chave JSON gerada no passo anterior
          export GOOGLE_APPLICATION_CREDENTIALS="gcp_key.json"
          
          python processing/silver.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS_DATA: ${{ secrets.GCP_SA_KEY }}