name: Execução Única - Sincronização Shopee

on:
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  sincronizar-shopee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar Imagens Promocionais das Top Ofertas
        run: python integration/gerar_ofertas.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Commit e push das imagens geradas
        run: |
            git config --global user.name "GitHub Action Bot"
            git config --global user.email "bot@github.com"
            git add ofertas_geradas/
            git diff --quiet && git diff --staged --quiet || (git commit -m "feat: atualiza imagens promocionais automáticas" && git push)