name: Pipeline de Teste - Atualização Completa

on:
  push:
    branches:
      - main # Ou a branch que você usa para testes
  workflow_dispatch: 

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests supabase pyarrow

      # Passo 1: Pega os dados do Atacadão e joga na silver_products (sem regras de kit ainda)
      - name: 1. Executar Silver Inicial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python processing/silver.py

      # Passo 2: A dimensão lê a silver, acha os IDs novos e define quem vira KIT
      - name: 2. Executar Dimensão (Definição de Kits)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python processing/dim_products.py

      # Passo 3: A silver roda de novo, agora lendo a dimensão, e aplica os nomes/preços finais
      - name: 3. Executar Silver Definitiva (Enriquecimento)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python processing/silver.py

      # Passo 4: Atualiza a Shopee com a base já processada e enriquecida
      - name: 4. Sincronizar com a Shopee
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
        run: python integration/shopee_update.py